name: Build Husk Duo IPA on GitHub-hosted Xcode 27
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-husk-ipa.yml', 'source/**', 'vendor/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: husk-owner-mac
  cancel-in-progress: true
jobs:
  build:
    name: Build Duo IPA with GitHub-hosted Xcode 27
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out private build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact reviewed source
        id: source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp .github/ci/write_status.py "$RUNNER_TEMP/husk-build-status.py"
          python3 - <<'DRIVER'
          import base64,hashlib,os
          from pathlib import Path
          data=base64.b64decode(Path('vendor/HuskMoltenVK-verified.zip.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(data).hexdigest()=='c47037417ac9b9a08b643cc0df97e7666fcb188435f90df9c95710796a6c8ccc'
          Path(os.environ['RUNNER_TEMP'],'husk-driver.zip').write_bytes(data)
          DRIVER
          python3 - <<'PYCODE'
          import base64,hashlib,json,os
          from pathlib import Path
          manifest=json.loads(Path('source/build.json').read_text())
          data=base64.b64decode(Path('source/husk.bundle.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(data).hexdigest()==manifest['bundle_sha256']
          Path(os.environ['RUNNER_TEMP'],'husk-source.bundle').write_bytes(data)
          with open(os.environ['GITHUB_ENV'],'a')as env:
              env.write('HUSK_SOURCE='+manifest['source']+'\nHUSK_SOURCE_TREE='+manifest['tree']+'\n')
          Path(os.environ['RUNNER_TEMP'],'husk-source-sha').write_text(manifest['source'])
          Path(os.environ['RUNNER_TEMP'],'husk-source-tree').write_text(manifest['tree'])
          PYCODE
          git -c http.https://github.com/.extraheader= fetch --no-tags https://github.com/aaULTra/Husk.git 27f8f3885e123f99eaeb0bbab822a53d6044da2d
          git -c http.https://github.com/.extraheader= fetch --no-tags https://github.com/Leviidev/Husk.git afe83d45b31194c4cc9f7b3db7ec2c757db8346e
          git bundle verify "$RUNNER_TEMP/husk-source.bundle"
          git bundle unbundle "$RUNNER_TEMP/husk-source.bundle"
          export HUSK_SOURCE=$(cat "$RUNNER_TEMP/husk-source-sha")
          git fetch --no-tags origin "$HUSK_SOURCE"
          git checkout --detach "$HUSK_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$(cat "$RUNNER_TEMP/husk-source-tree")"
          mkdir -p build/logs
          # The connected GitHub app can finish ref publication if the runner token lacks workflow-write scope.
          if ! git push origin HEAD:refs/heads/optimized > build/logs/source-publication.log 2>&1; then
            echo "Source objects sent; connected GitHub tool will finish branch publication."
          fi
          python3 "$RUNNER_TEMP/husk-build-status.py"
      - name: Fingerprint reusable build components
        id: cache_keys
        run: |
          python3 tests/translation-layer/test_ipa_build_cache.py
          python3 scripts/ipa_build_cache.py keys >> "$GITHUB_OUTPUT"
      - name: Restore pinned tools downloads and Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/husk/donors
            ${{ runner.tool_cache }}/husk/cargo
            ${{ runner.tool_cache }}/husk/rustup
            ${{ runner.tool_cache }}/husk/xcodegen-*
            ${{ runner.tool_cache }}/husk/vulkan-headers-*
            ${{ runner.tool_cache }}/husk/rppairing-target
            ${{ runner.tool_cache }}/husk/java-framework
          key: husk-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_keys.outputs.tools }}-${{ hashFiles('scripts/prepare_mac_build_tools.sh', 'scripts/build_rppairing_ios.sh', 'src/rppairing-ios/Cargo.lock', 'scripts/stage_graphics_build.py', 'scripts/stage_metal4_driver.py') }}
      - name: Restore source-matched native driver component
        id: driver_cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache/driver
          key: husk-driver-v1-${{ steps.cache_keys.outputs.driver }}
      - name: Restore source-matched Java component
        id: java_cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache/java
          key: husk-java-v1-${{ steps.cache_keys.outputs.java }}
      - name: Check every platform signing and packaging prerequisite
        id: platform
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        continue-on-error: true
        run: python3 scripts/mac_build_preflight.py platform
      - name: Run full regression suite including actual Duo policy
        id: regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          # python3 tests/translation-layer/test_duo_automatic.py -v
          # python3 tests/translation-layer/test_ue4_graphics.py -v
          # python3 tests/translation-layer/test_ue4_resolution_hook.py -v
          # python3 tests/translation-layer/test_source_efficiency.py -v
          # python3 tests/translation-layer/test_runtime_input_vulkan.py -v
          # python3 tests/translation-layer/test_compat_sync.py -v
          # python3 tests/translation-layer/test_publication_wait.py -v
          # python3 tests/translation-layer/test_queue_options.py -v
          # python3 tests/translation-layer/test_swapchain_budget.py -v
          # python3 tests/translation-layer/test_thread_policy.py -v
          # python3 tests/translation-layer/test_vk_frame_timing.py -v
          # python3 tests/translation-layer/test_present_clock.py -v
          # python3 tests/translation-layer/test_pipeline_store.py -v
          # python3 tests/translation-layer/test_component_profile.py -v
          # python3 tests/translation-layer/test_component_triage.py -v
          # python3 tests/translation-layer/test_device_profiles.py -v
          # python3 tests/translation-layer/test_driver_profile.py -v
          # python3 tests/translation-layer/test_efficiency.py -v
          # python3 tests/translation-layer/test_process_metrics.py -v
          # python3 tests/translation-layer/test_cpu_threads.py -v
          # python3 tests/translation-layer/test_efficiency_math.py -v
          # python3 tests/translation-layer/test_pipeline_core_state.py -v
          # python3 tests/translation-layer/test_pipeline_diagnostics.py -v
          # python3 tests/translation-layer/test_pipeline_feedback.py -v
          # python3 tests/translation-layer/test_game_chrome.py -v
          # python3 tests/translation-layer/test_gpu_timing.py -v
          # python3 tests/translation-layer/test_gpu_metal.py -v
          # python3 tests/translation-layer/test_gpu_vk_queue.py -v
          # python3 tests/translation-layer/test_render_inventory.py -v
          # python3 tests/translation-layer/test_efficiency_analysis.py -v
          # python3 tests/translation-layer/test_roadmap_progress.py -v
          # python3 tests/translation-layer/test_roadmap_projection.py -v
          # python3 tests/translation-layer/test_comparison_campaign.py -v
          # python3 tests/translation-layer/test_external_efficiency.py -v
          # python3 tests/translation-layer/test_spatial.py -v
          # python3 tests/translation-layer/test_spatial_lifetime.py -v
          # python3 tests/translation-layer/test_native_archive.py -v
          # python3 tests/translation-layer/test_native_archive_status.py -v
          # python3 tests/translation-layer/test_lifecycle_resilience.py -v
          # python3 tests/translation-layer/test_capture_consolidation.py -v
          # python3 tests/translation-layer/test_archive_compatibility.py -v
          # python3 tests/translation-layer/test_native_preparation_audit.py -v
          # python3 tests/translation-layer/test_native_display.py -v
          # python3 tests/translation-layer/test_upstream_native.py -v
          # python3 tests/translation-layer/test_apk_order.py -v
          # python3 tests/translation-layer/test_husk31_integration.py -v
          # python3 tests/translation-layer/test_crash_diagnostics.py -v
          # python3 tests/translation-layer/test_settings_grouping.py -v
          # python3 tests/translation-layer/test_reused_driver.py -v
          python3 tests/translation-layer/test_anki_web_resilience.py 2>&1 | tee build/logs/anki-web-regressions.log
          python3 tests/translation-layer/test_anki_downloads.py 2>&1 | tee build/logs/anki-download-regressions.log
          python3 tests/translation-layer/test_anki_webkit.py 2>&1 | tee build/logs/anki-webkit-regressions.log
          python3 tests/translation-layer/test_anki_socket_close.py 2>&1 | tee build/logs/anki-socket-close.log
          python3 scripts/run_mac_regressions.py 2>&1 | tee build/logs/regressions.log
      - name: Prepare clean cloud Mac build tools and check Vulkan SDK ABI
        id: tools
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_mac_build_tools.sh 2>&1 | tee build/logs/mac-tools.log
      - name: Stage matching release resources
        id: resources
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HUSK_TOOL_CACHE/donors"
          for version in 3.0 3.4; do
            file="$HUSK_TOOL_CACHE/donors/Husk-$version.ipa"
            if [ ! -s "$file" ]; then
              curl --fail --location --retry 3 "https://github.com/Leviidev/Husk/releases/download/$version/Husk.ipa" --output "$file.partial"
              mv "$file.partial" "$file"
            fi
          done
          python3 scripts/stage_graphics_build.py "$HUSK_TOOL_CACHE/donors/Husk-3.4.ipa" "$HUSK_TOOL_CACHE/donors/Husk-3.0.ipa"
      - name: Verify exact unchanged release Metal shaders
        id: shaders
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/stage_verified_shaders.py "$HUSK_TOOL_CACHE/donors/Husk-3.4.ipa"
          python3 tests/translation-layer/test_android_font_weight.py 2>&1 | tee build/logs/android-font-weight.log
      - name: Set up Java compiler for Android framework repair
        id: java_tools
        if: ${{ !cancelled() && steps.resources.outcome == 'success' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Rebuild and exercise the repaired Java framework
        id: java_framework
        if: ${{ !cancelled() && steps.java_tools.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/ipa_build_cache.py restore java '${{ steps.cache_keys.outputs.java }}'; then
            echo 'Reused source-matched tested Java DEX; fresh app build still required' | tee build/logs/java-framework.log
          else
            bash scripts/build_java_framework_for_ipa.sh 2>&1 | tee build/logs/java-framework.log
            python3 scripts/ipa_build_cache.py save java '${{ steps.cache_keys.outputs.java }}'
          fi
      - name: Save verified Java component for future app-only builds
        if: ${{ steps.java_framework.outcome == 'success' && steps.java_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/cache/java
          key: husk-java-v1-${{ steps.cache_keys.outputs.java }}
      - name: Verify unchanged driver independently
        id: driver
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/ipa_build_cache.py restore driver '${{ steps.cache_keys.outputs.driver }}'; then
            echo 'Reused verified matching native driver; app will be rebuilt' | tee build/logs/framegen-driver-build.log
          else
            bash scripts/build_spatial_moltenvk_ios.sh 2>&1 | tee build/logs/framegen-driver-build.log
            python3 scripts/ipa_build_cache.py save driver '${{ steps.cache_keys.outputs.driver }}'
          fi
          for item in Playport-0.5.0.ipa NOTICES.tar; do
            donor="$HUSK_TOOL_CACHE/donors/$item"
            if [ ! -s "$donor" ]; then
              curl --fail --location --retry 3 "https://github.com/playportdev/playport/releases/download/v0.5.0/$item" --output "$donor.partial"
              mv "$donor.partial" "$donor"
            fi
          done
          python3 scripts/stage_metal4_driver.py "$HUSK_TOOL_CACHE/donors/Playport-0.5.0.ipa" "$HUSK_TOOL_CACHE/donors/NOTICES.tar"
          xcrun lipo -archs build/ios-arm64/lib/KosmicKrisp.framework/KosmicKrisp
          xcrun nm -gU build/ios-arm64/lib/KosmicKrisp.framework/KosmicKrisp > build/logs/metal4-exports.txt
          grep -E "_vkGetInstanceProcAddr$" build/logs/metal4-exports.txt
          grep -E "_vkGetDeviceProcAddr$" build/logs/metal4-exports.txt
          xcrun otool -l build/ios-arm64/lib/KosmicKrisp.framework/KosmicKrisp > build/logs/metal4-load-commands.txt
          xcrun lipo -archs build/ios-arm64/lib/HuskMoltenVK.framework/HuskMoltenVK
          xcrun nm -gU build/ios-arm64/lib/HuskMoltenVK.framework/HuskMoltenVK > build/logs/driver-exports.txt
          for symbol in SpatialConfigure SpatialSnapshot SpatialObservations SpatialBindings DisplayConfigure DisplaySnapshot ArchiveConfigure ArchiveSnapshot ArchivePrepare ArchiveForget ArchivePriority FramegenConfigure FramegenSnapshot FramegenPause; do
            grep -E "_vkHusk${symbol}$" build/logs/driver-exports.txt
          done
      - name: Save verified native driver for future app-only builds
        if: ${{ steps.driver.outcome == 'success' && steps.driver_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/cache/driver
          key: husk-driver-v1-${{ steps.cache_keys.outputs.driver }}
      - name: Build pairing library with cached dependencies
        id: pairing
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_rppairing_ios.sh 2>&1 | tee build/logs/pairing.log
      - name: Check staged project and every required library
        id: project
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        continue-on-error: true
        run: python3 scripts/mac_build_preflight.py project
      - name: Report all setup failures together before app compilation
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        env:
          PREFLIGHT_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          steps=json.loads(os.environ['PREFLIGHT_STEPS'])
          required=['platform','regressions','tools','shaders','resources','java_framework','driver','pairing','project']
          report={name:steps.get(name,{}).get('outcome','missing') for name in required}
          Path('build/logs/setup-summary.json').write_text(json.dumps(report,indent=2))
          for name,outcome in report.items(): print(name+': '+outcome)
          failures=[name for name,outcome in report.items()if outcome!='success']
          if failures: raise SystemExit('Fix all reported prerequisites before compiling: '+', '.join(failures))
          print('All setup gates passed; compiling the fresh app now')
          PYCODE
      - name: Build and package fresh Duo IPA
        shell: bash
        run: |
          set -euo pipefail
          export DD="$HUSK_TOOL_CACHE/DerivedData"
          bash scripts/package_ipa.sh "$PWD/build/Husk-Duo.ipa"
          test -s build/Husk-Duo.ipa
          shasum -a 256 build/Husk-Duo.ipa
      - name: Upload installable IPA
        id: ipa
        uses: actions/upload-artifact@v4
        with:
          name: Husk-Duo-IPA
          path: build/Husk-Duo.ipa
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Save private build result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUSK_STATUS: ${{ job.status }}
          HUSK_ARTIFACT_ID: ${{ steps.ipa.outputs.artifact-id }}
        shell: bash
        run: python3 "$RUNNER_TEMP/husk-build-status.py"
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: husk-mac-build-logs
          path: |
            build/logs/
            ${{ runner.tool_cache }}/husk/DerivedData/build.log
          if-no-files-found: ignore
          retention-days: 3
