name: Check Mac Xcode runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-mac.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Verify Mac and iOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_NAME ($RUNNER_ARCH)"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun swift --version
          git --version
          command -v curl unzip make
          df -h "$RUNNER_TEMP"
