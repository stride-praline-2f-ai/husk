name: Check Mac Xcode runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-mac.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Verify Mac and iOS toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Runner: $RUNNER_NAME ($RUNNER_ARCH)"
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
            xcode-select -p
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-path
            xcrun swift --version
            git --version
            command -v curl unzip make
            df -h "$RUNNER_TEMP"
          } 2>&1 | tee "$RUNNER_TEMP/husk-mac-preflight.log"
      - name: Save bounded build-toolchain status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          report={'run_id':int(os.environ['GITHUB_RUN_ID']),'runner':os.environ['RUNNER_NAME'],'architecture':os.environ['RUNNER_ARCH'],'toolchain_outcome':os.environ['TOOLCHAIN_OUTCOME'],'log':Path(os.environ['RUNNER_TEMP'],'husk-mac-preflight.log').read_text()[-16000:]}
          url='https://api.github.com/repos/'+repo+'/contents/build-status/mac.json'
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'}
          body={'message':'[skip ci] Record owner Mac Xcode availability','content':base64.b64encode(json.dumps(report,indent=2).encode()).decode()}
          try:
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers))as response:body['sha']=json.load(response)['sha']
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps(body).encode(),headers=headers,method='PUT'))as response:json.load(response)
          print('Mac toolchain status saved')
          PY
